<!--FB:model-essentials:BEGIN--><script>window.__CA_MODEL_ESSENTIALS__={"toyota/corolla":{"makeName":"Toyota","name":"Corolla","years":"1966–present","status":"In production","segment":"Compact car","bodyStyles":["Sedan","Hatchback","Wagon"],"intro":"The best-selling nameplate in history — more than 50 million sold. The Corolla is the default answer to 'what car should I buy?' on every continent, and the GR Corolla proves the badge can still have a pulse.","generationCount":3},"toyota/camry":{"makeName":"Toyota","name":"Camry","years":"1982–present","status":"In production","segment":"Midsize sedan","bodyStyles":["Sedan"],"intro":"America's best-selling sedan for over two decades. The Camry is the car as appliance done perfectly — and since 2024, hybrid-only, which tells you where the whole segment went.","generationCount":3},"toyota/supra":{"makeName":"Toyota","name":"Supra","years":"1978–2002, 2019–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe"],"intro":"Four generations of inline-six grand tourer, one legend: the Mk IV's 2JZ engine became the most famous tuning platform on Earth. The name returned in 2019, co-developed with BMW.","generationCount":3},"toyota/land-cruiser":{"makeName":"Toyota","name":"Land Cruiser","years":"1951–present","status":"In production","segment":"Off-road SUV","bodyStyles":["SUV","Pickup"],"intro":"The vehicle that goes where roads apologize. From the FJ40 to the 300 Series, the Land Cruiser is the expedition default on every continent — the car aid workers and armies trust when failure isn't an option.","generationCount":8},"toyota/prius":{"makeName":"Toyota","name":"Prius","years":"1997–present","status":"In production","segment":"Hybrid","bodyStyles":["Liftback","Hatchback"],"intro":"The car that made 'hybrid' a word your parents knew. The second generation became a cultural symbol; the fifth became, improbably, genuinely good-looking.","generationCount":3},"toyota/tacoma":{"makeName":"Toyota","name":"Tacoma","years":"1995–present","status":"In production","segment":"Midsize pickup","bodyStyles":["Pickup"],"intro":"The midsize truck benchmark for resale value and trail credibility. Tacomas are bought, used hard for a decade, and sold for embarrassing fractions of their original price.","generationCount":3},"toyota/2000gt":{"makeName":"Toyota","name":"2000GT","years":"1967–1970","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe"],"intro":"Japan's first supercar. Co-developed with Yamaha, hand-built in tiny numbers — 351 cars — and proof in 1967 that Japan could build a world-class GT. A Bond film made one a convertible because Sean Connery didn't fit.","generationCount":1},"honda/civic":{"makeName":"Honda","name":"Civic","years":"1972–present","status":"In production","segment":"Compact car","bodyStyles":["Sedan","Hatchback","Coupe"],"intro":"Started as a fuel-crisis runabout and grew into the compact benchmark. Every generation has had a version worth caring about — and the Type R versions are among the best front-drive cars ever made.","generationCount":3},"honda/accord":{"makeName":"Honda","name":"Accord","years":"1976–present","status":"In production","segment":"Midsize sedan","bodyStyles":["Sedan","Coupe","Hatchback","Wagon"],"intro":"The family sedan for people who actually read reviews. The Accord spent decades trading best-in-class wins with the Camry, and usually won on steering and feel rather than on price.","generationCount":3},"honda/nsx":{"makeName":"Honda","name":"NSX","years":"1990–2005, 2016–2022","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Targa"],"intro":"The supercar that embarrassed Ferrari on reliability and usability, then came back 25 years later as a hybrid. Ayrton Senna helped develop the first one. That fact alone tells you the intent.","generationCount":2},"honda/s2000":{"makeName":"Honda","name":"S2000","years":"1999–2009","status":"Discontinued","segment":"Sports car","bodyStyles":["Roadster"],"intro":"A 9,000 rpm love letter to the naturally aspirated engine. The F20C made 120 hp per litre — a record for a production road car at launch — and the shifter is still the benchmark every manual is judged against.","generationCount":2},"honda/cr-v":{"makeName":"Honda","name":"CR-V","years":"1995–present","status":"In production","segment":"Compact SUV","bodyStyles":["SUV"],"intro":"One of the original car-based crossovers, and still the sensible default in the segment. It has never been exciting. It has also never really been beaten at the job it was built for.","generationCount":3},"nissan/gt-r":{"makeName":"Nissan","name":"GT-R","years":"2007–2025","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe"],"intro":"Nissan's giant-killer, built for 17 years with one brief: be faster than cars costing three times as much. It mostly was. All-wheel drive, a hand-built twin-turbo V6, and a launch-control party trick that never got old.","generationCount":2},"nissan/z":{"makeName":"Nissan","name":"Z","years":"1969–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe","Roadster"],"intro":"The people's sports car, running since 1969 with a long nap in the middle. The 240Z made performance democratic; the current car keeps the twin-turbo, rear-drive, manual-gearbox faith alive when most rivals dropped it.","generationCount":3},"nissan/skyline-gt-r":{"makeName":"Nissan","name":"Skyline GT-R","years":"1989–2002","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe"],"intro":"Three generations of Skyline GT-R that never officially came to America — which only sharpened the legend. The RB26 engine's official 276 hp was a gentlemen's-agreement fiction everyone politely maintained.","generationCount":3},"nissan/leaf":{"makeName":"Nissan","name":"Leaf","years":"2010–present","status":"In production","segment":"Electric hatchback","bodyStyles":["Hatchback","Crossover"],"intro":"The car that proved ordinary people would buy an electric car if it was priced like a car. First-generation cars depreciate like dropped phones, which makes a healthy-battery example one of the cheapest ways to run a second car there is.","generationCount":3},"nissan/patrol":{"makeName":"Nissan","name":"Patrol","years":"1951–present","status":"In production","segment":"Off-road SUV","bodyStyles":["SUV"],"intro":"Land Cruiser's oldest rival, and in much of the Middle East and Australia, the preferred one. The Patrol is what UN fleets and desert drivers buy when a breakdown is not a survivable option.","generationCount":3},"mazda/mx-5-miata":{"makeName":"Mazda","name":"MX-5 Miata","years":"1989–present","status":"In production","segment":"Sports car","bodyStyles":["Roadster"],"intro":"The best-selling two-seat sports car in history, and the answer to almost any 'what fun car should I buy?' question. Power was never the point. Response, weight, and a roof that drops in seconds always were.","generationCount":3},"mazda/rx-7":{"makeName":"Mazda","name":"RX-7","years":"1978–2002","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe"],"intro":"The rotary engine's masterpiece. Three generations, one idea: light weight and an engine that revs like a motorcycle. The FD is the famous one; the earlier cars are the honest bargains.","generationCount":3},"mazda/mazda3":{"makeName":"Mazda","name":"Mazda3","years":"2003–present","status":"In production","segment":"Compact car","bodyStyles":["Hatchback","Sedan"],"intro":"The compact for people who notice steering feel. Mazda kept giving the 3 a better interior and sharper chassis than the segment required, and the current turbo AWD car is nearly a luxury product wearing a mainstream badge.","generationCount":3},"mazda/cx-5":{"makeName":"Mazda","name":"CX-5","years":"2012–present","status":"In production","segment":"Compact SUV","bodyStyles":["SUV"],"intro":"The crossover that proved family cars didn't have to steer like appliances. The CX-5 built Mazda's modern business — the profits from this car fund everything else the company makes.","generationCount":3},"subaru/impreza-wrx":{"makeName":"Subaru","name":"Impreza WRX","years":"1992–present","status":"In production","segment":"Compact sports sedan","bodyStyles":["Sedan","Hatchback","Wagon"],"intro":"Rally car for the road, in continuous production in spirit since 1992. Turbo flat-four, all-wheel drive, and a bonnet scoop you could set your watch by. The STI versions are modern classics; the plain WRX is just a great all-weather fast car.","generationCount":3},"subaru/outback":{"makeName":"Subaru","name":"Outback","years":"1994–present","status":"In production","segment":"Wagon / crossover","bodyStyles":["Wagon","Crossover"],"intro":"The wagon that out-SUV'd the SUVs. Subaru jacked up a Legacy, added cladding, and accidentally created the blueprint for half the cars on American roads today — while never giving up the wagon part.","generationCount":3},"subaru/brz":{"makeName":"Subaru","name":"BRZ","years":"2012–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe"],"intro":"Proof a sports car doesn't need power, it needs balance. Subaru built the flat-four and the chassis; Toyota handled much of the rest. The result is the car driving instructors and racers agree on.","generationCount":2},"subaru/forester":{"makeName":"Subaru","name":"Forester","years":"1997–present","status":"In production","segment":"Compact SUV","bodyStyles":["SUV"],"intro":"The tall, boxy, all-weather wagon-SUV that Vermont runs on. Early turbo XTs are cult cars; later ones are simply the sensible answer for snow-belt families who refuse to buy a crossover that looks like an egg.","generationCount":3},"hyundai/elantra":{"makeName":"Hyundai","name":"Elantra","years":"1990–present","status":"In production","segment":"Compact car","bodyStyles":["Sedan","Hatchback"],"intro":"Hyundai's compact started as transport for people who couldn't afford a Civic and ended up producing the Elantra N, one of the best performance bargains on sale. That arc is Hyundai's last 30 years in miniature.","generationCount":3},"hyundai/sonata":{"makeName":"Hyundai","name":"Sonata","years":"1985–present","status":"In production","segment":"Midsize sedan","bodyStyles":["Sedan"],"intro":"The car that announced Hyundai could design. The 2011 Sonata's swooping styling forced every midsize rival to follow, and the current car splits its personality between efficient hybrids and a properly quick N Line.","generationCount":3},"hyundai/ioniq-5":{"makeName":"Hyundai","name":"Ioniq 5","years":"2021–present","status":"In production","segment":"Electric crossover","bodyStyles":["Hatchback","Crossover"],"intro":"A retro-futuristic hatchback the size of a crossover, and the car that made Hyundai a design leader in the EV era. Pixel lights, a flat floor, and charging speeds that embarrassed cars costing twice as much at launch.","generationCount":1},"hyundai/tucson":{"makeName":"Hyundai","name":"Tucson","years":"2004–present","status":"In production","segment":"Compact SUV","bodyStyles":["SUV"],"intro":"Hyundai's RAV4 and CR-V rival, and the model that shows how far the mainstream range has come: the current hybrid is efficient, quick enough, and styled like it escaped from a motor show stand.","generationCount":3},"ford/model-t":{"makeName":"Ford","name":"Model T","years":"1908–1927","status":"Discontinued","segment":"Mass-market car","bodyStyles":["Touring","Runabout","Sedan","Pickup"],"intro":"The car that put the world on wheels. Ford built over 15 million of them, cut the price from $850 to under $300, and in doing so invented the moving assembly line's reason to exist. By the early 1920s, roughly half the cars on Earth were Model Ts.","generationCount":1},"ford/mustang":{"makeName":"Ford","name":"Mustang","years":"1964–present","status":"In production","segment":"Pony car","bodyStyles":["Coupe","Convertible","Fastback"],"intro":"Launched in April 1964 and sold 22,000 cars on day one. The Mustang invented the pony car — long hood, short deck, endless options list — and has survived gas crises, the Mustang II, and the SUV era without ever leaving production.","generationCount":7},"ford/f-series":{"makeName":"Ford","name":"F-Series (F-150)","years":"1948–present","status":"In production","segment":"Full-size pickup","bodyStyles":["Pickup"],"intro":"America's best-selling vehicle line for over four decades. The F-Series is less a model than an economy — work truck, family hauler, off-road toy, and status symbol, all on the same ladder frame.","generationCount":3},"ford/gt":{"makeName":"Ford","name":"GT (GT40 lineage)","years":"1964–1969, 2005–2006, 2017–2022","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe"],"intro":"One nameplate, three separate vendettas against physics. The GT40 was built to beat Ferrari at Le Mans after Enzo walked away from selling to Ford — and did it four years straight, 1966 to 1969. Both modern revivals exist because that grudge never cooled.","generationCount":3},"ford/bronco":{"makeName":"Ford","name":"Bronco","years":"1966–1996, 2021–present","status":"In production","segment":"Off-road SUV","bodyStyles":["SUV"],"intro":"Ford's answer to the Jeep CJ in 1966, a full-size truck-based SUV by the 1980s, dead in 1996, and revived in 2021 as a removable-roof Wrangler rival. The first-generation trucks are the collector sweet spot; the new one is the one you can actually use daily.","generationCount":3},"chevrolet/corvette":{"makeName":"Chevrolet","name":"Corvette","years":"1953–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe","Convertible"],"intro":"America's attainable supercar since 1953. The Corvette's trick has always been the arithmetic: most of a European exotic's speed for a fraction of the price. The C8's move to a mid-engine layout in 2020 broke a 67-year tradition and nobody sensible misses the old one.","generationCount":8},"chevrolet/camaro":{"makeName":"Chevrolet","name":"Camaro","years":"1967–2002, 2010–2024","status":"Discontinued","segment":"Pony car","bodyStyles":["Coupe","Convertible"],"intro":"GM's answer to the Mustang, launched for 1967 and locked in the pony-car war for six generations. Production ended again in 2024 with no successor announced — the sixth generation went out as the best-driving Camaro ever made.","generationCount":3},"chevrolet/silverado":{"makeName":"Chevrolet","name":"Silverado","years":"1999–present","status":"In production","segment":"Full-size pickup","bodyStyles":["Pickup"],"intro":"Chevrolet's full-size truck and Ford's oldest argument. Chevrolet pickups go back to 1918, but the Silverado nameplate dates to 1999, when it replaced the C/K line. The 3.0L Duramax diesel is the connoisseur's pick; the 6.2L V8 is the loud one.","generationCount":3},"chevrolet/bel-air":{"makeName":"Chevrolet","name":"Bel Air","years":"1950–1975","status":"Discontinued","segment":"Full-size car","bodyStyles":["Sedan","Coupe","Convertible","Wagon"],"intro":"Chevrolet's top trim line through the 1950s, and the 1955–1957 'Tri-Five' cars are about as close as American design gets to universal agreement. The '57 Bel Air is shorthand for the whole decade.","generationCount":2},"chevrolet/impala":{"makeName":"Chevrolet","name":"Impala","years":"1958–1985, 1994–1996, 2000–2020","status":"Discontinued","segment":"Full-size sedan","bodyStyles":["Sedan","Coupe","Convertible","Wagon"],"intro":"Chevrolet's flagship nameplate from 1958, and the best-selling car in America through the mid-1960s — over a million sold in 1965 alone. It lived three lives: the 1960s icon, the 1990s Impala SS sleeper, and a competent front-drive sedan until 2020.","generationCount":3},"jeep/wrangler":{"makeName":"Jeep","name":"Wrangler","years":"1987–present","status":"In production","segment":"Off-road SUV","bodyStyles":["SUV"],"intro":"The direct descendant of the Willys MB that won a war, carried through the CJ line and renamed Wrangler in 1987. Solid axles, a folding windshield, doors that come off — the formula has survived four corporate owners because altering it would end the business.","generationCount":3},"jeep/grand-cherokee":{"makeName":"Jeep","name":"Grand Cherokee","years":"1993–present","status":"In production","segment":"Midsize SUV","bodyStyles":["SUV"],"intro":"The SUV that took Jeep upmarket. The Grand Cherokee created the premium 4x4 niche in 1993 — proper off-road hardware under a vehicle you'd park at a hotel — and Range Rover has been answering it ever since.","generationCount":3},"jeep/cj":{"makeName":"Jeep","name":"CJ (Civilian Jeep)","years":"1945–1986","status":"Discontinued","segment":"Off-road utility","bodyStyles":["SUV"],"intro":"CJ stands for Civilian Jeep — the Willys MB demobbed in 1945 and sold to farmers, surveyors, and anyone who needed to get somewhere roads didn't go. The CJ-5 alone ran for 29 years, and every Wrangler since is this shape with better manners.","generationCount":3},"jeep/wagoneer":{"makeName":"Jeep","name":"Wagoneer","years":"1963–1991, 2022–present","status":"In production","segment":"Full-size SUV","bodyStyles":["SUV","Wagon"],"intro":"The original luxury SUV. The SJ Wagoneer arrived in 1963, predating the Range Rover by seven years, and its wood-sided Grand Wagoneer finale became the Hamptons driveway default. Jeep revived the name in 2022 as a three-row flagship.","generationCount":2},"tesla/roadster":{"makeName":"Tesla","name":"Roadster","years":"2008–2012","status":"Discontinued","segment":"Electric sports car","bodyStyles":["Roadster"],"intro":"The car that started it. Tesla's first product took a Lotus Elise chassis, replaced the running gear with batteries and a single electric motor, and proved in 2008 that an electric car could be the fast one. A successor has been promised for years and has not reached production.","generationCount":1},"tesla/model-s":{"makeName":"Tesla","name":"Model S","years":"2012–present","status":"In production","segment":"Executive sedan","bodyStyles":["Sedan"],"intro":"The car that forced every major maker to build an EV program. Launched in 2012 with range and acceleration no production EV had combined before, and still on sale — heavily revised underneath — more than a decade later.","generationCount":2},"tesla/model-3":{"makeName":"Tesla","name":"Model 3","years":"2017–present","status":"In production","segment":"Compact sedan","bodyStyles":["Sedan"],"intro":"Tesla's mass-market bet, and the car that took EVs mainstream: over two million sold, the best-selling EV in the world for stretches of its life, and the reason every legacy maker now has an electric sedan program.","generationCount":2},"tesla/model-y":{"makeName":"Tesla","name":"Model Y","years":"2020–present","status":"In production","segment":"Compact crossover SUV","bodyStyles":["SUV"],"intro":"The best-selling car in the world in 2023 — not the best-selling EV, the best-selling car, full stop. The Model Y is the Model 3's formula raised onto a crossover body, and it outsells everything Tesla makes combined.","generationCount":2},"tesla/cybertruck":{"makeName":"Tesla","name":"Cybertruck","years":"2023–present","status":"In production","segment":"Electric pickup","bodyStyles":["Pickup"],"intro":"Unveiled in 2019 with a smashed window on stage, delivered from late 2023. The Cybertruck's stainless wedge looks like a rendering error; underneath sit genuinely radical choices — steer-by-wire and a 48V architecture — wrapped in the most polarising truck ever sold.","generationCount":1},"bmw/3-series":{"makeName":"BMW","name":"3 Series","years":"1975–present","status":"In production","segment":"Compact executive car","bodyStyles":["Sedan","Wagon","Coupe","Convertible"],"intro":"The sports sedan benchmark for fifty years. Other brands build rivals; BMW builds the car they are measured against. The recipe has swollen and softened at times, but a straight-six 3 Series driven hard is still the reference.","generationCount":3},"bmw/5-series":{"makeName":"BMW","name":"5 Series","years":"1972–present","status":"In production","segment":"Executive car","bodyStyles":["Sedan","Wagon"],"intro":"The executive sedan done the BMW way: rear-drive balance, a proper straight-six up front, and just enough aggression. At its best — the E39 — it was possibly the finest sedan in the world.","generationCount":3},"bmw/m3":{"makeName":"BMW","name":"M3","years":"1986–present","status":"In production","segment":"Sports sedan","bodyStyles":["Coupe","Sedan","Convertible","Wagon"],"intro":"Born as a homologation special for touring-car racing, kept as the fast 3 Series with its own engine, chassis, and attitude. The market treats it as its own model, and so does everyone who has driven one.","generationCount":3},"bmw/2002":{"makeName":"BMW","name":"2002","years":"1968–1976","status":"Discontinued","segment":"Compact sports sedan","bodyStyles":["Coupe","Convertible"],"intro":"The car that saved BMW in America and invented the sports sedan formula: a boxy two-door, a willing four-cylinder, and handling that made contemporary Detroit iron feel broken. Every 3 Series since is an apology for, or a tribute to, this car.","generationCount":1},"bmw/x5":{"makeName":"BMW","name":"X5","years":"1999–present","status":"In production","segment":"Luxury SUV","bodyStyles":["SUV"],"intro":"BMW insisted on calling it a Sports Activity Vehicle, and for once the marketing was honest: the X5 drove like a tall 5 Series when every rival drove like a truck. It built the performance-SUV segment the whole industry now lives in.","generationCount":3},"mercedes-benz/s-class":{"makeName":"Mercedes-Benz","name":"S-Class","years":"1972–present","status":"In production","segment":"Full-size luxury sedan","bodyStyles":["Sedan","Coupe"],"intro":"The car the rest of the industry copies five years later. Air suspension, massaging seats, night vision — if it debuts anywhere, it debuts here. The name is short for Sonderklasse: special class. It has earned it more often than not.","generationCount":3},"mercedes-benz/e-class":{"makeName":"Mercedes-Benz","name":"E-Class","years":"1984–present","status":"In production","segment":"Executive car","bodyStyles":["Sedan","Wagon","Coupe","Convertible"],"intro":"The taxi in Stuttgart, the boardroom car everywhere else. The E-Class line — the W124 carried it before the name existed — is Mercedes at its most durable and least theatrical, which is exactly the point.","generationCount":3},"mercedes-benz/sl":{"makeName":"Mercedes-Benz","name":"SL","years":"1954–present","status":"In production","segment":"Grand tourer","bodyStyles":["Coupe","Roadster"],"intro":"It starts with the 300SL Gullwing — the fastest production car of its day and still the collector benchmark — and continues as seven decades of open-top grand touring. The current car is an AMG product; the early car is automotive royalty.","generationCount":3},"mercedes-benz/g-class":{"makeName":"Mercedes-Benz","name":"G-Class","years":"1979–present","status":"In production","segment":"Luxury off-road SUV","bodyStyles":["SUV"],"intro":"A military utility vehicle that became a luxury icon without changing its silhouette. Three locking differentials, a ladder frame, and door hinges on the outside — the shape is the substance, and Mercedes has wisely never messed with it.","generationCount":3},"mercedes-benz/amg-gt":{"makeName":"Mercedes-Benz","name":"AMG GT","years":"2014–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe","Roadster"],"intro":"AMG's own car, not a tuned Mercedes: a front-mid V8, a transaxle at the back, and a long bonnet with the cabin sitting nearly over the rear wheels. The second generation shares its bones with the SL and got more civilised; the first one is the purist's pick.","generationCount":2},"porsche/911":{"makeName":"Porsche","name":"911","years":"1964–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe","Convertible","Targa"],"intro":"One car, perfected for sixty years. The engine is still in the wrong place, the silhouette is still a teardrop, and the 911 is still the sports car everything else is judged against — because Porsche never stopped developing it.","generationCount":8},"porsche/cayenne":{"makeName":"Porsche","name":"Cayenne","years":"2002–present","status":"In production","segment":"Luxury SUV","bodyStyles":["SUV"],"intro":"The SUV that saved Porsche — purists hated it in 2002 and the profits funded every GT car since. It also happened to be genuinely good: fast, capable off-road, and unmistakably a Porsche to drive.","generationCount":3},"porsche/taycan":{"makeName":"Porsche","name":"Taycan","years":"2019–present","status":"In production","segment":"Electric sports sedan","bodyStyles":["Sedan","Wagon"],"intro":"Porsche's first EV, built to answer one question: can an electric car feel like a Porsche? Two-speed rear gearbox, repeatable launch control, and steering that talks. The answer held up.","generationCount":1},"porsche/356":{"makeName":"Porsche","name":"356","years":"1948–1965","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Convertible","Speedster"],"intro":"The first production Porsche: a Beetle-derived aluminium coupe built in a sawmill in Gmünd, Austria, that became the template for everything after. Light, slippery, and quicker than cars with twice the power.","generationCount":2},"porsche/718-cayman-boxster":{"makeName":"Porsche","name":"718 Cayman/Boxster","years":"1996–2025","status":"Discontinued","segment":"Mid-engine sports car","bodyStyles":["Roadster","Coupe"],"intro":"The Boxster saved Porsche in the 1990s; the Cayman coupe followed in 2005, and the pair became the handling benchmark money could buy. Renamed 718 in 2016 for the turbo flat-four era, then redeemed by the 4.0-litre sixes. Production of the petrol cars ended in 2025, with an electric successor planned.","generationCount":3},"volkswagen/beetle":{"makeName":"Volkswagen","name":"Beetle","years":"1938–2019","status":"Discontinued","segment":"Compact car","bodyStyles":["Coupe","Convertible"],"intro":"The best-selling single design in car history — over 21 million originals. An air-cooled rear-engined economy car that outlived its century, then came back twice as nostalgia. The original is the one that matters.","generationCount":3},"volkswagen/golf":{"makeName":"Volkswagen","name":"Golf","years":"1974–present","status":"In production","segment":"Compact car","bodyStyles":["Hatchback","Wagon"],"intro":"The Beetle's replacement and the car that defined the modern hatchback. The GTI variant invented the hot hatch in 1976 — a family car with a big engine and red trim that embarrassed sports cars — and every generation since has had to live up to it.","generationCount":3},"volkswagen/type-2":{"makeName":"Volkswagen","name":"Type 2 (Bus)","years":"1950–2013","status":"Discontinued","segment":"Van","bodyStyles":["Van","Pickup"],"intro":"A delivery van that became a cultural era. The Bus carried hippies, surfboards, families, and half of Brazil — production there ran until 2013. Few vehicles have ever meant as much to as many different people.","generationCount":2},"volkswagen/passat":{"makeName":"Volkswagen","name":"Passat","years":"1973–present","status":"In production","segment":"Midsize car","bodyStyles":["Sedan","Wagon"],"intro":"Volkswagen's sensible family car for fifty years — which produced some genuinely odd highlights, including a W8 engine nobody asked for. The US sedan ended in 2022, but the nameplate continues in Europe as a wagon and in China as a sedan.","generationCount":3},"audi/quattro":{"makeName":"Audi","name":"Quattro","years":"1980–1991","status":"Discontinued","segment":"Sports coupe","bodyStyles":["Coupe"],"intro":"The original — Ur-Quattro in German, ur meaning ancestral. A turbocharged five-cylinder coupe with permanent all-wheel drive, launched in 1980 when that combination did not exist in a road car. It rewrote rallying, then rewrote what a fast road car was supposed to be. Every quattro-badged Audi since — the badge is lowercase for the system now — is this car's descendant.","generationCount":3},"audi/a4":{"makeName":"Audi","name":"A4","years":"1994–present","status":"In production","segment":"Compact executive car","bodyStyles":["Sedan","Wagon"],"intro":"Audi's 3 Series rival and the car that made its interiors the industry benchmark. The formula has been consistent for thirty years: restrained styling, a cabin a class above, and quattro all-wheel drive as the calling card.","generationCount":3},"audi/r8":{"makeName":"Audi","name":"R8","years":"2006–2024","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe","Convertible"],"intro":"Audi's supercar, built on Lamborghini bones and better for being the sensible one: a V8 — then a soaring naturally aspirated V10 — behind the seats, all-wheel drive, and usability no Italian rival matched. The first generation's gated manual is already legend.","generationCount":2},"audi/tt":{"makeName":"Audi","name":"TT","years":"1998–2023","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Roadster"],"intro":"A design concept that escaped the motor show almost unchanged. The first TT was Bauhaus on wheels — a perfect geometric statement with a car underneath — and the line spent 25 years getting faster, peaking with the five-cylinder TT RS.","generationCount":3},"ferrari/f40":{"makeName":"Ferrari","name":"F40","years":"1987–1992","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe"],"intro":"Enzo Ferrari's last signed-off car, built for the company's 40th anniversary. A twin-turbo V8, a Kevlar-and-carbon body, no ABS, no power steering, no apology. About 1,300 were built and it remains the rawest road car Ferrari has ever sold.","generationCount":1},"ferrari/laferrari":{"makeName":"Ferrari","name":"LaFerrari","years":"2013–2018","status":"Discontinued","segment":"Hypercar","bodyStyles":["Coupe","Convertible"],"intro":"Ferrari's hybrid flagship and its answer to the McLaren P1 and Porsche 918. A 6.3-litre V12 plus a KERS electric motor, 499 coupes, then 210 Aperta roadsters. Offered by invitation only, and most never left collections.","generationCount":2},"ferrari/testarossa":{"makeName":"Ferrari","name":"Testarossa","years":"1984–1996","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe"],"intro":"The poster car of the 1980s. Side strakes feeding side-mounted radiators, a flat-12 mounted low in the middle, and a starring role on Miami Vice. Nearly 10,000 were built across the Testarossa, 512 TR and F512 M — huge numbers for a Ferrari flagship.","generationCount":3},"ferrari/enzo":{"makeName":"Ferrari","name":"Enzo","years":"2002–2004","status":"Discontinued","segment":"Hypercar","bodyStyles":["Coupe"],"intro":"Named for the founder and built as a Formula 1 car in road clothes — carbon tub, automated-manual gearbox, carbon-ceramic brakes, and aero that generated serious downforce without a big rear wing. 400 built, including the last one for the Pope.","generationCount":1},"ferrari/roma":{"makeName":"Ferrari","name":"Roma","years":"2020–present","status":"In production","segment":"Grand tourer","bodyStyles":["Coupe","Convertible"],"intro":"Ferrari's front-engined coupé in its softest suit: clean, retro-leaning styling, a 2+ cabin and the twin-turbo V8 from the Portofino turned up. The Spider convertible followed. It's the Ferrari for people who found the rest of the range too shouty.","generationCount":1},"lamborghini/miura":{"makeName":"Lamborghini","name":"Miura","years":"1966–1973","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe"],"intro":"The car that invented the mid-engined supercar. Ferruccio Lamborghini's young engineers built it after hours, against his wishes — he wanted a grand tourer. The transverse V12 layout rewrote the rulebook permanently, and Gandini's styling has never been bettered at Sant'Agata.","generationCount":1},"lamborghini/countach":{"makeName":"Lamborghini","name":"Countach","years":"1974–1990","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe"],"intro":"The wedge. Gandini's scissor-doored V12 spent sixteen years as the definitive poster car, growing wider, wingier and faster the whole way. Impractical, cramped, nearly impossible to reverse — and completely untouchable as an object.","generationCount":3},"lamborghini/huracan":{"makeName":"Lamborghini","name":"Huracán","years":"2014–2024","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe","Convertible"],"intro":"The Gallardo's successor and the last of the naturally aspirated V10s. Over two decades of production variants — Evo, Performante, STO, Tecnica, Sterrato — made it Lamborghini's best-selling sports car before the Temerario replaced it in 2024.","generationCount":2},"lamborghini/aventador":{"makeName":"Lamborghini","name":"Aventador","years":"2011–2022","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe","Convertible"],"intro":"The V12 flagship for a decade: carbon monocoque, pushrod suspension, scissor doors, and a 6.5-litre V12 that outlived three generations of rivals. Replaced by the hybrid Revuelto, which makes the Aventador the last pure-V12 Lamborghini flagship.","generationCount":2},"lamborghini/urus":{"makeName":"Lamborghini","name":"Urus","years":"2018–present","status":"In production","segment":"Luxury SUV","bodyStyles":["SUV"],"intro":"The 'Super SUV' that doubled Lamborghini's sales and paid for everything else in the catalogue. Purists scoffed in 2018; the order books answered. Genuinely fast, genuinely usable, and the reason Lamborghini can still afford V12 flagships.","generationCount":2},"volvo/240":{"makeName":"Volvo","name":"240","years":"1974–1993","status":"Discontinued","segment":"Midsize car","bodyStyles":["Sedan","Wagon","Coupe"],"intro":"The brick. Nearly three million built over nineteen years, and a significant number are still running — the 240 is the car that made Volvo's safety-and-durability reputation permanent. Slow, upright, honest, and close to immortal when maintained.","generationCount":2},"volvo/xc90":{"makeName":"Volvo","name":"XC90","years":"2002–present","status":"In production","segment":"Midsize luxury SUV","bodyStyles":["SUV"],"intro":"Volvo's bestseller and the car that proved a seven-seat SUV could be about safety instead of size. The second-generation car's interior — open-pore wood, a portrait touchscreen, seats like armchairs — embarrassed German rivals at launch.","generationCount":2},"volvo/p1800":{"makeName":"Volvo","name":"P1800","years":"1961–1973","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe","Shooting brake"],"intro":"Volvo's beautiful mistake: a curvaceous Italian-styled GT from a company known for boxes, built first by Jensen in England. Roger Moore drove one in The Saint, and one New York owner's car passed three million miles — the highest mileage ever recorded.","generationCount":2},"volvo/v60":{"makeName":"Volvo","name":"V60","years":"2010–2026","status":"Discontinued","segment":"Midsize wagon","bodyStyles":["Wagon"],"intro":"The modern Volvo wagon done properly: long roof, low stance, and in T8 Polestar Engineered form, 455 hp nobody asked for and everybody wants. America's wagon drought made it a cult car here; in Sweden it was just a car.","generationCount":2},"jaguar/e-type":{"makeName":"Jaguar","name":"E-Type","years":"1961–1975","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Convertible"],"intro":"Enzo Ferrari reportedly called it the most beautiful car ever made, and he was not wrong. 150 mph for a third of an Aston's price in 1961, on a monocoque with the XK engine and independent rear suspension. The standard every GT since has been judged against.","generationCount":3},"jaguar/xj":{"makeName":"Jaguar","name":"XJ","years":"1968–2019","status":"Discontinued","segment":"Full-size luxury sedan","bodyStyles":["Sedan"],"intro":"Jaguar's flagship saloon for half a century, from William Lyons' Series I to Ian Callum's radical X351. The XJ was always the driver's luxury car — lighter, lower and keener than the German default, when it wasn't being let down by 1970s build quality.","generationCount":3},"jaguar/f-type":{"makeName":"Jaguar","name":"F-Type","years":"2013–2024","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Convertible"],"intro":"The E-Type's self-appointed heir: an aluminium two-seater with supercharged V6 and V8 engines and a crackling exhaust that became its signature. The facelift cleaned up the styling; the SVR turned it into a genuine supercar-baiter.","generationCount":2},"jaguar/xk120":{"makeName":"Jaguar","name":"XK120","years":"1948–1954","status":"Discontinued","segment":"Sports car","bodyStyles":["Roadster","Coupe"],"intro":"A show car that escaped. Jaguar built the XK120 for the 1948 London Motor Show as a showcase for its new XK engine, took hundreds of orders, and had to put it into production. It defined the British sports car for a generation and launched Jaguar's Le Mans era.","generationCount":1},"land-rover/defender":{"makeName":"Land Rover","name":"Defender","years":"1990–2016, 2020–present","status":"In production","segment":"Off-road SUV","bodyStyles":["SUV"],"intro":"Seventy years of farm, army and expedition service made the original Defender a British institution — and about as comfortable as one. The 2020 replacement kept the name and the look, replaced the ladder frame and live axles with a monocoque, and sold in numbers the original never approached.","generationCount":2},"land-rover/range-rover":{"makeName":"Land Rover","name":"Range Rover","years":"1970–present","status":"In production","segment":"Full-size luxury SUV","bodyStyles":["SUV"],"intro":"The original luxury SUV, from 1970: coil springs, a V8, and a design so right that one sat in the Louvre. Every generation since has traded a little more mud-plugging honesty for a lot more polish, and the fifth is now a full-scale limousine that can still wade nearly a metre of water.","generationCount":3},"land-rover/discovery":{"makeName":"Land Rover","name":"Discovery","years":"1989–present","status":"In production","segment":"Midsize luxury SUV","bodyStyles":["SUV"],"intro":"The middle child done right: seven seats, real off-road hardware and a stepped roof you can spot a mile away. The Discovery has always been the Land Rover for families who actually leave tarmac, even if the fifth generation dresses like it doesn't.","generationCount":3},"lexus/ls":{"makeName":"Lexus","name":"LS","years":"1989–present","status":"In production","segment":"Full-size luxury sedan","bodyStyles":["Sedan"],"intro":"The car that launched a marque. Toyota's secret Flagship One project produced a V8 saloon quieter and cheaper than a Mercedes S-Class, and German boardrooms have respected Lexus ever since.","generationCount":3},"lexus/lfa":{"makeName":"Lexus","name":"LFA","years":"2010–2012","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe"],"intro":"A decade in development, a carbon tub, and a Yamaha-co-developed V10 that revs to 9,000 rpm faster than an analogue tach could follow — so the dial went digital. 500 built, each at a loss.","generationCount":1},"lexus/is":{"makeName":"Lexus","name":"IS","years":"1999–present","status":"In production","segment":"Compact luxury sedan","bodyStyles":["Sedan"],"intro":"Lexus's answer to the 3 Series, sold in Japan as the Toyota Altezza — chronograph-style instruments, a jewel of a straight six, and later the V8 IS 500 as a parting gift to the segment.","generationCount":2},"lexus/rx":{"makeName":"Lexus","name":"RX","years":"1998–present","status":"In production","segment":"Mid-size luxury crossover","bodyStyles":["SUV"],"intro":"The original luxury crossover — a car-based SUV before the industry had a name for it. The RX hybrid of 2005 also made electrification a luxury feature rather than a compromise.","generationCount":3},"lexus/lc":{"makeName":"Lexus","name":"LC","years":"2017–present","status":"In production","segment":"Grand tourer","bodyStyles":["Coupe","Convertible"],"intro":"The LF-LC concept car made production almost unchanged — a V8 grand tourer with concept-car surfacing, a ten-speed automatic, and one of the great interiors of its decade.","generationCount":1},"alfa-romeo/giulia":{"makeName":"Alfa Romeo","name":"Giulia","years":"2016–present","status":"In production","segment":"Sports sedan","bodyStyles":["Sedan"],"intro":"Project Giorgio: Alfa poached Ferrari engineers, spent billions, and produced a rear-drive sedan whose Quadrifoglio variant — with a Ferrari-derived twin-turbo V6 — reset the sports-sedan benchmark.","generationCount":1},"alfa-romeo/stelvio":{"makeName":"Alfa Romeo","name":"Stelvio","years":"2017–present","status":"In production","segment":"Luxury crossover","bodyStyles":["SUV"],"intro":"The Giulia's platform under an SUV body, named for the pass with 48 hairpins. The Quadrifoglio version held the Nürburgring SUV lap record on launch.","generationCount":1},"alfa-romeo/spider":{"makeName":"Alfa Romeo","name":"Spider","years":"1966–1994","status":"Discontinued","segment":"Roadster","bodyStyles":["Convertible"],"intro":"The Duetto: Pininfarina's round-tail roadster, Dustin Hoffman's co-star in The Graduate, and one of the longest-lived sports car designs ever — 28 years with the same basic body.","generationCount":2},"alfa-romeo/8c-competizione":{"makeName":"Alfa Romeo","name":"8C Competizione","years":"2007–2010","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe","Convertible"],"intro":"A concept car Alfa actually built: carbon body over a Maserati-derived chassis with Ferrari's 4.7 V8 up front. 500 coupés, then 500 Spiders, all sold before production began.","generationCount":1},"alfa-romeo/giulia-sprint-gt":{"makeName":"Alfa Romeo","name":"Giulia Sprint GT","years":"1963–1976","status":"Discontinued","segment":"Sports coupe","bodyStyles":["Coupe"],"intro":"Bertone's stepped-nose coupé, styled by a young Giorgetto Giugiaro. The GTA variant — aluminium skin, twin-plug head — owned European touring car racing in the late 1960s.","generationCount":2},"aston-martin/db5":{"makeName":"Aston Martin","name":"DB5","years":"1963–1965","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe","Convertible"],"intro":"The Goldfinger car — though the DB4 did the engineering, the DB5 did the immortality. Tadek Marek's twin-cam six, a ZF five-speed, and the template for every Aston since.","generationCount":1},"aston-martin/v8-vantage":{"makeName":"Aston Martin","name":"V8 Vantage","years":"2005–2018","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Convertible"],"intro":"The Gaydon-era entry Aston: hand-assembled Jaguar-derived V8, a proper manual gearbox for most of its life, and styling that aged better than anything else in its class.","generationCount":2},"aston-martin/db11":{"makeName":"Aston Martin","name":"DB11","years":"2016–2024","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe","Convertible"],"intro":"The first car of Aston's 'second century' plan: new bonded structure, a twin-turbo V12 of Aston's own, then an AMG V8 that many testers preferred for its lighter nose.","generationCount":2},"aston-martin/dbx":{"makeName":"Aston Martin","name":"DBX","years":"2020–present","status":"In production","segment":"Luxury SUV","bodyStyles":["SUV"],"intro":"The SUV that saved Aston Martin, built in a new Welsh factory. The DBX707 briefly held the title of most powerful production SUV in the world.","generationCount":1},"aston-martin/valkyrie":{"makeName":"Aston Martin","name":"Valkyrie","years":"2021–present","status":"In production","segment":"Hypercar","bodyStyles":["Coupe"],"intro":"Adrian Newey's road car: a Cosworth V12 revving to 11,000 rpm, a hybrid system filling the torque gaps, and downforce figures from a Formula 1 wind tunnel. 150 coupés, all spoken for.","generationCount":1},"cadillac/eldorado":{"makeName":"Cadillac","name":"Eldorado","years":"1953–2002","status":"Discontinued","segment":"Personal luxury coupe","bodyStyles":["Coupe","Convertible"],"intro":"Fifty years of America's idea of luxury, from the hand-built 1953 convertible through the tallest tailfins ever fitted to a production car, to the final front-drive coupé of 2002.","generationCount":2},"cadillac/escalade":{"makeName":"Cadillac","name":"Escalade","years":"1999–present","status":"In production","segment":"Full-size luxury SUV","bodyStyles":["SUV"],"intro":"A Yukon Denali in a tuxedo that became a cultural fixture — and Cadillac's profit engine. The current car added a 38-inch curved OLED and a 682 hp V-Series.","generationCount":2},"cadillac/cts-v":{"makeName":"Cadillac","name":"CTS-V","years":"2004–2019","status":"Discontinued","segment":"Sports sedan","bodyStyles":["Sedan","Coupe","Wagon"],"intro":"Corvette engines in a Cadillac sedan, three generations running. The second-gen wagon with a manual gearbox is one of the most collectible American cars of the 2010s.","generationCount":2},"cadillac/ct5-v-blackwing":{"makeName":"Cadillac","name":"CT5-V Blackwing","years":"2022–present","status":"In production","segment":"Sports sedan","bodyStyles":["Sedan"],"intro":"The last of its kind: a supercharged V8, rear-wheel drive, and a six-speed manual with no-lift shift, in a segment that went hybrid and all-wheel drive. Cadillac kept it in production because demand refused to die.","generationCount":1},"dodge/charger":{"makeName":"Dodge","name":"Charger","years":"1966–present","status":"In production","segment":"Muscle car","bodyStyles":["Coupe","Sedan"],"intro":"From the 1968 car that defined the muscle silhouette, through two decades as a four-door sedan with Hellcat power, to the electric-and-six-cylinder Charger of 2024 — the nameplate keeps reinventing the same idea.","generationCount":3},"dodge/challenger":{"makeName":"Dodge","name":"Challenger","years":"1970–2023","status":"Discontinued","segment":"Muscle car","bodyStyles":["Coupe"],"intro":"Late to the pony-car fight in 1970, gone by 1974, then reborn in 2008 as a full-size retro coupé that outlived its rivals — and ended with the 840 hp Demon and the 1,025 hp Demon 170.","generationCount":2},"dodge/viper":{"makeName":"Dodge","name":"Viper","years":"1992–2017","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe","Convertible"],"intro":"A V10, a tube frame, and no apology: no ABS, no traction control, no side windows on the first cars. Five generations of America's most honest sports car.","generationCount":2},"dodge/durango":{"makeName":"Dodge","name":"Durango","years":"1998–present","status":"In production","segment":"Full-size SUV","bodyStyles":["SUV"],"intro":"Three rows and a Hemi for most of its life. The SRT Hellcat version — 710 hp, briefly the most powerful production SUV in the world — turned the school run into a drag strip.","generationCount":1},"gmc/sierra-1500":{"makeName":"GMC","name":"Sierra 1500","years":"1999–present","status":"In production","segment":"Full-size pickup","bodyStyles":["Pickup"],"intro":"Chevrolet's Silverado with a premium brief — and in Denali form, the truck that taught American luxury buyers to shop at a GMC store. C/K pickups carried the lineage before the Sierra name took over.","generationCount":2},"gmc/yukon":{"makeName":"GMC","name":"Yukon","years":"1992–present","status":"In production","segment":"Full-size SUV","bodyStyles":["SUV"],"intro":"The Tahoe's plusher twin since 1992. Yukon Denali became so dominant that 'Denali' is effectively GMC's luxury sub-brand, and the current XL is a genuine Escalade alternative.","generationCount":2},"gmc/hummer-ev":{"makeName":"GMC","name":"Hummer EV","years":"2022–present","status":"In production","segment":"Electric off-roader","bodyStyles":["Pickup","SUV"],"intro":"The Hummer name reborn as a 4-tonne electric flagship: three motors, 1,000 hp, four-wheel steering with CrabWalk, and an open-air roof. Absurd, deliberate, and a genuine halo.","generationCount":1},"gmc/syclone":{"makeName":"GMC","name":"Syclone","years":"1991","status":"Discontinued","segment":"Sport truck","bodyStyles":["Pickup"],"intro":"A turbocharged, all-wheel-drive S-10 that out-accelerated a Ferrari 348 in a famous 1991 comparison test. 2,995 built, all black, and the original American sport truck.","generationCount":1},"kia/stinger":{"makeName":"Kia","name":"Stinger","years":"2018–2023","status":"Discontinued","segment":"Sports sedan","bodyStyles":["Sedan"],"intro":"Kia's gran turismo: rear-drive, a twin-turbo V6, and chassis tuning by BMW M's former engineering chief Albert Biermann. It never sold like a 4 Series — which is why the good ones are bargains.","generationCount":1},"kia/ev6":{"makeName":"Kia","name":"EV6","years":"2021–present","status":"In production","segment":"Electric crossover","bodyStyles":["Crossover"],"intro":"The E-GMP skateboard in a shooting-brake suit: 800-volt charging, a European Car of the Year trophy, and a GT flagship with 576 hp that embarrassed supercars at drag strips.","generationCount":1},"kia/telluride":{"makeName":"Kia","name":"Telluride","years":"2020–present","status":"In production","segment":"Mid-size SUV","bodyStyles":["SUV"],"intro":"The three-row that swept the 2020 awards — World Car of the Year, MotorTrend SUV of the Year, North American Utility of the Year — by being honest, handsome, and priced under the Germans it out-finished.","generationCount":1},"kia/soul":{"makeName":"Kia","name":"Soul","years":"2009–2025","status":"Discontinued","segment":"Compact crossover","bodyStyles":["Hatchback"],"intro":"The box the hamsters sold: a tall hatchback with genuine design wit that became Kia's American breakthrough car. Three generations over 16 years before the market moved to crossovers proper.","generationCount":2},"lotus/elan":{"makeName":"Lotus","name":"Elan","years":"1962–1975","status":"Discontinued","segment":"Roadster","bodyStyles":["Convertible","Coupe"],"intro":"The definitive Chapman road car: a steel backbone chassis, fibreglass body, twin-cam power, and 675 kg. The Elan's steering feel is still the reference other roadsters are measured against — Mazda benchmarked it for the MX-5.","generationCount":1},"lotus/esprit":{"makeName":"Lotus","name":"Esprit","years":"1976–2004","status":"Discontinued","segment":"Sports car","bodyStyles":["Coupe"],"intro":"Giugiaro's wedge, Bond's submarine, and 28 years of evolution from a 160 hp four to a twin-turbo V8. The last hand-built Lotus flagship and a study in keeping one design alive.","generationCount":2},"lotus/elise":{"makeName":"Lotus","name":"Elise","years":"1996–2021","status":"Discontinued","segment":"Roadster","bodyStyles":["Convertible"],"intro":"The car that saved Lotus, named for Romano Artioli's granddaughter. A bonded aluminium tub at 725 kg proved in 1996 that lightness, not power, was the way back.","generationCount":2},"lotus/emira":{"makeName":"Lotus","name":"Emira","years":"2022–present","status":"In production","segment":"Sports car","bodyStyles":["Coupe"],"intro":"The last petrol Lotus: AMG's turbo four or Toyota's supercharged V6, hydraulic steering feel, and supercar surfacing at sports-car money. A farewell written with unusual care.","generationCount":1},"lotus/evija":{"makeName":"Lotus","name":"Evija","years":"2020–present","status":"In production","segment":"Electric hypercar","bodyStyles":["Coupe"],"intro":"Lotus's electric reset: four motors, a 2,000 PS target, and Venturi tunnels through the rear bodywork. Eight customer cars a year make it the rarest thing Hethel has built.","generationCount":1},"maserati/ghibli-am115":{"makeName":"Maserati","name":"Ghibli (AM115)","years":"1967–1973","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe","Convertible"],"intro":"Giugiaro's masterpiece for Ghia: a long-bonnet GT with a quad-cam V8 and the longest, lowest silhouette of its era. The SS with the 4.9 is the one that matters.","generationCount":1},"maserati/ghibli-m157":{"makeName":"Maserati","name":"Ghibli (M157)","years":"2013–2024","status":"Discontinued","segment":"Luxury sports sedan","bodyStyles":["Sedan"],"intro":"The modern Ghibli took the fight to the 5 Series with Ferrari-built twin-turbo engines and proper Italian drama. The Trofeo's 580 hp V8 made it a Q-car of the first order.","generationCount":1},"maserati/quattroporte":{"makeName":"Maserati","name":"Quattroporte","years":"1963–2024","status":"Discontinued","segment":"Luxury sports sedan","bodyStyles":["Sedan"],"intro":"The original sports saloon: Maserati put racing V8s in four-door bodies in 1963 and kept the nameplate alive for six generations until 2024.","generationCount":2},"maserati/granturismo":{"makeName":"Maserati","name":"GranTurismo","years":"2007–present","status":"In production","segment":"Grand tourer","bodyStyles":["Coupe"],"intro":"Pininfarina's long-lived GT defined Maserati for a decade with a Ferrari V8; the second generation returned in 2023 with the Nettuno V6 and an all-electric Folgore flagship.","generationCount":2},"maserati/mc12":{"makeName":"Maserati","name":"MC12","years":"2004–2005","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe","Convertible"],"intro":"Maserati's return to racing, built on the Enzo's bones to homologate a GT1 car. Bigger, rarer, and in race trim far more successful than the Ferrari it came from — five FIA GT titles.","generationCount":1},"maserati/mc20":{"makeName":"Maserati","name":"MC20","years":"2021–present","status":"In production","segment":"Supercar","bodyStyles":["Coupe","Convertible"],"intro":"The Trident's clean-sheet supercar: a carbon tub, butterfly doors, and the Nettuno V6 with F1-style pre-chamber ignition — Maserati's own engine again, at last.","generationCount":1},"mclaren/f1":{"makeName":"McLaren","name":"F1","years":"1992–1998","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe"],"intro":"Gordon Murray's manifesto: a BMW V12, a carbon monocoque, a central driving seat, gold foil in the engine bay, and no turbos, no four-wheel drive, no compromise. Still the fastest naturally aspirated production car ever built.","generationCount":1},"mclaren/p1":{"makeName":"McLaren","name":"P1","years":"2013–2015","status":"Discontinued","segment":"Hybrid hypercar","bodyStyles":["Coupe"],"intro":"The hybrid holy-trinity car from Woking: a twin-turbo V8 plus an electric motor filling every torque gap, active aero, and a Race mode that drops the car 50 mm. 375 built.","generationCount":1},"mclaren/720s":{"makeName":"McLaren","name":"720S","years":"2017–2023","status":"Discontinued","segment":"Supercar","bodyStyles":["Coupe","Convertible"],"intro":"The second-generation Super Series car that humiliated everything at the drag strip: lighter, faster, and more usable than the class it redefined. Replaced by the 750S.","generationCount":1},"mclaren/senna":{"makeName":"McLaren","name":"Senna","years":"2018–2019","status":"Discontinued","segment":"Track hypercar","bodyStyles":["Coupe"],"intro":"Named for Ayrton, built for lap time: 800 kg of downforce, a door you can see the road through, and styling dictated entirely by the wind. 500 cars, all sold before the reveal.","generationCount":1},"mclaren/artura":{"makeName":"McLaren","name":"Artura","years":"2022–present","status":"In production","segment":"Hybrid supercar","bodyStyles":["Coupe","Convertible"],"intro":"McLaren's reset: an all-new carbon architecture, a 120-degree V6 hybrid, and the electric-only running a supercar needs for the 2020s. The Spider is the pick of the range.","generationCount":1},"delorean/dmc-12":{"makeName":"DeLorean","name":"DMC-12","years":"1981–1983","status":"Discontinued","segment":"Sports coupe","bodyStyles":["Coupe"],"intro":"The only DeLorean: a Giugiaro wedge in brushed stainless steel over a Lotus-engineered backbone chassis, built in Northern Ireland with British government money. Underpowered, over budget, and — after Back to the Future — the most recognisable car of the 1980s.","generationCount":1},"duesenberg/model-a":{"makeName":"Duesenberg","name":"Model A","years":"1921–1926","status":"Discontinued","segment":"Luxury touring car","bodyStyles":["Sedan","Convertible"],"intro":"The Duesenberg brothers' first production car, and a technical landmark: a straight-eight with an overhead cam in an era of flatheads, and four-wheel hydraulic brakes when rivals braked the rear wheels only.","generationCount":1},"duesenberg/model-j":{"makeName":"Duesenberg","name":"Model J","years":"1928–1937","status":"Discontinued","segment":"Luxury chassis / coachbuilt grand tourer","bodyStyles":["Convertible","Sedan","Coupe"],"intro":"Unveiled at the 1928 New York show as a chassis alone costing more than a whole Cadillac: 265 hp when 100 was a lot, built to carry the greatest coachwork of the age — Murphy, LeBaron, Derham, Figoni. The definitive American classic.","generationCount":2},"packard/twelve":{"makeName":"Packard","name":"Twelve","years":"1933–1939","status":"Discontinued","segment":"Luxury flagship sedan","bodyStyles":["Sedan","Convertible","Coupe"],"intro":"Packard's V12 flagship — launched as the Twin Six in 1932, renamed Twelve a year later — was Detroit's answer to the great European chassis: silent, torquey, and bodied by the best shops in America.","generationCount":1},"packard/super-eight":{"makeName":"Packard","name":"Super Eight","years":"1933–1950","status":"Discontinued","segment":"Luxury sedan","bodyStyles":["Sedan","Convertible"],"intro":"The straight-eight backbone of the Packard range for nearly two decades — the car most people meant by 'a Packard' — spanning the Classic era, the streamline years and the first postwar cars.","generationCount":1},"packard/caribbean":{"makeName":"Packard","name":"Caribbean","years":"1953–1956","status":"Discontinued","segment":"Luxury convertible / hardtop","bodyStyles":["Convertible","Coupe"],"intro":"Packard's halo car of the fifties: a low-volume convertible with continental flair, wire wheels and tri-tone paint, built to fight Cadillac's Eldorado. The 1956 hardtop joined for the final year.","generationCount":1},"packard/hawk":{"makeName":"Packard","name":"Hawk","years":"1958","status":"Discontinued","segment":"Personal luxury coupe","bodyStyles":["Coupe"],"intro":"The last real Packard, built for one year on Studebaker bones in South Bend: a supercharged Golden Hawk in Packard dress, with padded armrests on the outside of the doors and the marque's final flourish of fins.","generationCount":1},"saab/92-96":{"makeName":"Saab","name":"92 / 93 / 96","years":"1949–1980","status":"Discontinued","segment":"Compact family car","bodyStyles":["Sedan","Wagon"],"intro":"Saab's first three decades in one line: a teardrop two-stroke shaped by aircraft engineers, evolved from the 92 through the 93 to the long-lived 96 — rally winner, family staple, and the car that made front-wheel drive make sense in winter.","generationCount":2},"saab/99":{"makeName":"Saab","name":"99","years":"1968–1984","status":"Discontinued","segment":"Compact executive car","bodyStyles":["Sedan","Hatchback"],"intro":"The bigger, safer Saab: wraparound windscreen, ignition by the handbrake, and in 1978 the 99 Turbo — one of the first production cars to make turbocharging a road-car virtue rather than a racing trick.","generationCount":2},"saab/900":{"makeName":"Saab","name":"900","years":"1978–1998","status":"Discontinued","segment":"Executive hatchback / convertible","bodyStyles":["Hatchback","Sedan","Convertible"],"intro":"The Saab most people picture: the upright windscreen, the deep hatch, the turbo whistle. The 'classic' 900 ran fifteen years and made the marque; its GM-platform successor shared the name and little else.","generationCount":2},"saab/9000":{"makeName":"Saab","name":"9000","years":"1985–1998","status":"Discontinued","segment":"Executive sedan / hatchback","bodyStyles":["Sedan","Hatchback"],"intro":"Saab's big car, developed with Fiat, Lancia and Alfa Romeo on the shared Type Four programme — but characteristically Saabified, and in Aero form one of the great sleepers: mid-range punch that embarrassed period supercars.","generationCount":1},"saab/9-3":{"makeName":"Saab","name":"9-3","years":"1998–2011","status":"Discontinued","segment":"Compact executive car","bodyStyles":["Sedan","Convertible","Wagon"],"intro":"The 900's successor under GM, twice over: first a deep facelift of the old car — Viggen included — then the 2003 Sport Sedan, all-new, with the Aero V6 and the all-wheel-drive Turbo X as its peaks. NEVS briefly restarted the line in 2013.","generationCount":2},"saab/9-5":{"makeName":"Saab","name":"9-5","years":"1997–2012","status":"Discontinued","segment":"Executive sedan / wagon","bodyStyles":["Sedan","Wagon"],"intro":"The 9000's replacement and Saab's flagship for fifteen years: the thinking driver's E-Class alternative, with the Aero estate as the connoisseur's express. Its handsome 2010 successor arrived just in time for the bankruptcy, and production stayed tiny.","generationCount":2},"studebaker/loewy-coupes":{"makeName":"Studebaker","name":"Loewy Coupes (Starlight / Starliner)","years":"1953–1955","status":"Discontinued","segment":"Personal coupe","bodyStyles":["Coupe"],"intro":"The 1953 coupes designed under Raymond Loewy — Robert Bourke's clean, low, European line — are regularly called the most beautiful American cars of the fifties. They became the foundation of the Hawk line that followed.","generationCount":1},"studebaker/lark":{"makeName":"Studebaker","name":"Lark","years":"1959–1966","status":"Discontinued","segment":"Compact family car","bodyStyles":["Sedan","Wagon","Convertible"],"intro":"The compact that saved Studebaker for a while: launched in 1959 just as America discovered small cars, it briefly returned the company to profit — and with the optional V8s, it was quietly quick.","generationCount":1},"studebaker/gran-turismo-hawk":{"makeName":"Studebaker","name":"Gran Turismo Hawk","years":"1962–1964","status":"Discontinued","segment":"Grand tourer","bodyStyles":["Coupe"],"intro":"Brooks Stevens restyled the Loewy coupe's bones into a formal, Mercedes-tinged GT for 1962 — the last Studebaker with real money spent on it, and a credible grand tourer at a Chevrolet price.","generationCount":1},"studebaker/avanti":{"makeName":"Studebaker","name":"Avanti","years":"1963–1964","status":"Discontinued","segment":"Sports coupe","bodyStyles":["Coupe"],"intro":"Raymond Loewy's team designed it in weeks; Brooks Stevens' studio finished it: a fibreglass, bottom-breather GT with a supercharged option, roll bar built in, and speed records at Bonneville. Studebaker died; the Avanti, built by others, lived on for decades.","generationCount":1},"tucker/48":{"makeName":"Tucker","name":"48","years":"1948","status":"Discontinued","segment":"Full-size sedan","bodyStyles":["Sedan"],"intro":"The 'Tin Goose' prototype and fifty production cars: a rear-engined, flat-six sedan years ahead of Detroit — padded dash, pop-out windscreen, a third headlight that turned with the steering, and a corporation that became a courtroom legend.","generationCount":1},"amc/javelin":{"makeName":"AMC","name":"Javelin","years":"1968–1974","status":"Discontinued","segment":"Pony car","bodyStyles":["Coupe"],"intro":"AMC's pony car, and a good one: styled by Dick Teague, raced by Penske, and armed with engines up to the 401. The second-generation car won the Trans-Am championship outright in 1971 and 1972.","generationCount":2},"amc/amx":{"makeName":"AMC","name":"AMX","years":"1968–1970","status":"Discontinued","segment":"Sports coupe","bodyStyles":["Coupe"],"intro":"America's other two-seat sports car: a Javelin with a foot cut out of the wheelbase, a 390 V8 option, and a name made of the company's initials. Craig Breedlove took one to Bonneville records before it even went on sale.","generationCount":1},"amc/gremlin":{"makeName":"AMC","name":"Gremlin","years":"1970–1978","status":"Discontinued","segment":"Subcompact hatchback","bodyStyles":["Hatchback"],"intro":"Introduced on April Fool's Day, 1970 — a Rambler American with the back chopped off, styled on an air-sickness bag according to legend. Cheap, cheeky, and with the optional 304 V8, absurdly quick for a subcompact.","generationCount":1},"amc/pacer":{"makeName":"AMC","name":"Pacer","years":"1975–1980","status":"Discontinued","segment":"Compact wide-body car","bodyStyles":["Hatchback","Wagon"],"intro":"The wide small car: as broad as a full-size sedan, glass everywhere, and one door longer than the other so rear passengers could climb in. Designed for a rotary engine GM cancelled, immortalised by Wayne's World.","generationCount":1},"amc/eagle":{"makeName":"AMC","name":"Eagle","years":"1980–1988","status":"Discontinued","segment":"All-wheel-drive family car","bodyStyles":["Wagon","Sedan","Hatchback"],"intro":"The crossover, invented fifteen years early: a Concord body on full-time all-wheel drive with raised suspension, in wagon, sedan, coupe and the SX/4 hatch. Subaru and every modern crossover owe it a footnote at least.","generationCount":1},"pontiac/gto":{"makeName":"Pontiac","name":"GTO","years":"1964–2006","status":"Discontinued","segment":"Muscle car","bodyStyles":["Coupe","Convertible"],"intro":"The original muscle car: John DeLorean's team slipped a 389 big-block into a mid-size Tempest in 1964 and the era began. Judge, Ram Air, a wilderness decade, and a final Australian-built encore in 2004.","generationCount":3},"pontiac/firebird":{"makeName":"Pontiac","name":"Firebird / Trans Am","years":"1967–2002","status":"Discontinued","segment":"Pony car / muscle car","bodyStyles":["Coupe","Convertible"],"intro":"Pontiac's F-body, four generations deep: Ram Air originals, the SD-455, the Bandit phenomenon, Knight Rider, and a final LS1 WS6 that was a Corvette in a tuxedo t-shirt.","generationCount":3},"pontiac/grand-prix":{"makeName":"Pontiac","name":"Grand Prix","years":"1962–2008","status":"Discontinued","segment":"Personal luxury coupe / sedan","bodyStyles":["Coupe","Sedan"],"intro":"Pontiac's personal-luxury nameplate for 46 years: born as a full-size performance coupe with bucket seats and a 421 option, ending as a supercharged front-drive sedan — the GXP even got a V8.","generationCount":2},"pontiac/bonneville":{"makeName":"Pontiac","name":"Bonneville","years":"1957–2005","status":"Discontinued","segment":"Full-size flagship","bodyStyles":["Convertible","Sedan","Coupe"],"intro":"Named for the salt flats and launched as a fuel-injected convertible flagship in 1957 — every first-year car was a convertible, and 'fuel injection' was Pontiac announcing it had arrived as a performance brand.","generationCount":1},"pontiac/fiero":{"makeName":"Pontiac","name":"Fiero","years":"1984–1988","status":"Discontinued","segment":"Mid-engine sports coupe","bodyStyles":["Coupe"],"intro":"America's mid-engine commuter car that became a sports car just in time to be cancelled: plastic panels on a spaceframe, a V6 GT by 1985, and a proper fastback for 1986. The 1988 suspension — finally all Pontiac's own design — was the best and the last.","generationCount":1},"pontiac/solstice":{"makeName":"Pontiac","name":"Solstice","years":"2006–2010","status":"Discontinued","segment":"Roadster","bodyStyles":["Convertible","Coupe"],"intro":"Bob Lutz's back-to-basics roadster and Pontiac's last halo: a concept car (2002) willed into production, outselling the MX-5 in its first year, with the turbo GXP and a rare targa coupe as the collector endings.","generationCount":1},"oldsmobile/curved-dash":{"makeName":"Oldsmobile","name":"Curved Dash Oldsmobile","years":"1901–1907","status":"Discontinued","segment":"Runabout","bodyStyles":["Convertible"],"intro":"The car that started mass production's story: a $650 single-cylinder runabout built in the thousands while rivals built dozens — the first Oldsmobile, and for a while the best-selling car in America.","generationCount":1},"oldsmobile/rocket-88":{"makeName":"Oldsmobile","name":"88 / Rocket 88","years":"1949–1999","status":"Discontinued","segment":"Full-size sedan","bodyStyles":["Sedan","Coupe","Convertible"],"intro":"The 1949 Rocket 88 — a modern overhead-valve V8 in the lighter body — is a founding document of the muscle-car idea and the subject of what is often called the first rock-and-roll record. The 88 nameplate then ran for fifty years.","generationCount":1},"oldsmobile/4-4-2":{"makeName":"Oldsmobile","name":"4-4-2","years":"1964–1972","status":"Discontinued","segment":"Muscle car","bodyStyles":["Coupe","Convertible"],"intro":"Four-barrel, four-speed, dual exhausts — the name was the spec sheet. Born as a police-package option in the GTO's shadow, the 4-4-2 became its own model and, in 455 W-30 form, one of the era's fastest.","generationCount":2},"oldsmobile/toronado":{"makeName":"Oldsmobile","name":"Toronado","years":"1966–1992","status":"Discontinued","segment":"Personal luxury coupe","bodyStyles":["Coupe"],"intro":"The car that brought front-wheel drive back to America: a 7-litre V8 driving the front wheels through a chain-driven transaxle, styled like a jet-age sculpture. It worked, it sold, and it changed GM's engineering map.","generationCount":1},"oldsmobile/cutlass":{"makeName":"Oldsmobile","name":"Cutlass","years":"1961–1999","status":"Discontinued","segment":"Mid-size family car","bodyStyles":["Sedan","Coupe","Wagon","Convertible"],"intro":"For a time, the Cutlass was simply the best-selling car in America — the nameplate that carried Oldsmobile's volume from the muscle era through the G-body years, with the Supreme as the default upgrade buy of the suburbs.","generationCount":1},"oldsmobile/aurora":{"makeName":"Oldsmobile","name":"Aurora","years":"1995–2003","status":"Discontinued","segment":"Luxury sedan","bodyStyles":["Sedan"],"intro":"Oldsmobile's last flagship and its best car in decades: a Northstar-derived 4.0 V8, a rigid shell, and concept-car styling — the car that was meant to save the marque and instead became its elegant farewell.","generationCount":1},"plymouth/barracuda":{"makeName":"Plymouth","name":"Barracuda","years":"1964–1974","status":"Discontinued","segment":"Pony car / muscle car","bodyStyles":["Coupe","Convertible"],"intro":"Launched April 1, 1964 — two weeks before the Mustang — on Valiant bones with the biggest rear window in the business. By 1970 the E-body 'Cuda had become the muscle era's apex predator, and the Hemi convertible its holy grail.","generationCount":2},"plymouth/road-runner":{"makeName":"Plymouth","name":"Road Runner","years":"1968–1980","status":"Discontinued","segment":"Muscle car","bodyStyles":["Coupe","Convertible"],"intro":"Plymouth paid Warner Bros. for the cartoon bird and spent the savings on speed: a stripped B-body, a 383 with magnum internals, and a 'meep meep' horn. The 1970 Superbird wore a nose cone and a wing for NASCAR — and for immortality.","generationCount":1},"plymouth/gtx":{"makeName":"Plymouth","name":"GTX","years":"1967–1971","status":"Discontinued","segment":"Muscle car","bodyStyles":["Coupe","Convertible"],"intro":"The gentleman's muscle car: Plymouth's upscale B-body with the 440 Super Commando standard and the Hemi on the option list, pitched at buyers who wanted the pace without the stripper spec.","generationCount":1},"plymouth/duster":{"makeName":"Plymouth","name":"Duster","years":"1970–1976","status":"Discontinued","segment":"Compact muscle / coupe","bodyStyles":["Coupe"],"intro":"The budget bruiser: a Valiant fastback coupe that, with the 340 small-block, outran cars twice its price and embarrassed its own stablemates. The Twister trim sold the look; the 340 sold the legend.","generationCount":1},"plymouth/prowler":{"makeName":"Plymouth","name":"Prowler","years":"1997–2002","status":"Discontinued","segment":"Retro roadster","bodyStyles":["Convertible"],"intro":"A factory hot rod in 1997: aluminium-intensive, open-wheeled retro styling, and a concept car Chrysler actually built. The V6-only powertrain was the compromise; the look was not.","generationCount":1},"plymouth/voyager":{"makeName":"Plymouth","name":"Voyager","years":"1984–2000","status":"Discontinued","segment":"Minivan","bodyStyles":["Minivan"],"intro":"With the Dodge Caravan, the 1984 Voyager invented the modern minivan: front-wheel drive, a car floor height, and a sliding door, selling families out of station wagons by the millions. Lee Iacocca's second act saved Chrysler.","generationCount":1}};window.__CA_DATASET_UPDATED_AT__="2026-10-13";</script><!--FB:model-essentials:END-->
